name: Build APK

# 云端打包 ARM64 APK。
# runtime-v2 资产（proot-host / ubuntu rootfs）与 Termux bootstrap 不进仓库，
# 构建时从官方 release APK 现场提取（与源码版本严格对齐 v1.4.8-test.3）。
# 签名使用仓库内 testkey_untrusted.jks（测试签名，口令见 local.properties 步骤，
# 仅用于本地/CI 验证构建，不可用于正式发布）。

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OFFICIAL_APK_URL: https://github.com/TensorHub-ORG/Coomi/releases/download/v1.4.8-test.3/Coomi-Android-arm64-v1.4.8-test.3.apk

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust 1.95.0 (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;27.0.12077973" >/dev/null

      - name: Extract runtime assets from official APK
        run: |
          curl -sL -o /tmp/official.apk "$OFFICIAL_APK_URL"
          mkdir -p runtime-v2-dist references/termux-bootstrap /tmp/apkx
          cd /tmp/apkx
          unzip -o -q /tmp/official.apk "assets/runtime-v2/*" "lib/arm64-v8a/libtermux-bootstrap.so"
          cp assets/runtime-v2/proot-host-arm64.tgz "$GITHUB_WORKSPACE/runtime-v2-dist/proot-host-arm64.tar.gz"
          cp assets/runtime-v2/ubuntu-noble-arm64.tgz "$GITHUB_WORKSPACE/runtime-v2-dist/ubuntu-noble-arm64.tar.gz"
          # libtermux-bootstrap.so = ELF 头 + 内嵌 bootstrap zip（Termux 标准打包方式），
          # 从第一个 PK 头截取还原为 gradle 期望的 bootstrap-aarch64.zip。
          python3 - <<'PY'
          import os
          so = open('lib/arm64-v8a/libtermux-bootstrap.so', 'rb').read()
          off = so.find(b'PK\x03\x04')
          assert off > 0, 'bootstrap zip header not found in libtermux-bootstrap.so'
          out = os.path.join(os.environ['GITHUB_WORKSPACE'],
                             'references/termux-bootstrap/bootstrap-aarch64.zip')
          open(out, 'wb').write(so[off:])
          import zipfile
          zipfile.ZipFile(out).testzip()
          print('bootstrap-aarch64.zip restored:', os.path.getsize(out), 'bytes')
          PY

      - name: Write signing properties
        run: |
          cat > local.properties <<'EOF'
          coomi.signing.storePassword=coomi-test-2026
          coomi.signing.keyPassword=coomi-test-2026
          EOF

      - name: Build frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Build APK (assembleDebug)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Coomi-debug-apk
          path: apps/coomi-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
